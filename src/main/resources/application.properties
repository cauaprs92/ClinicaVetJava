# Porta do site: http://localhost:8082
# (a JavaHotel usa a 8081, então os dois projetos podem rodar ao mesmo tempo)
server.port=8082

# Pastas com o site: a pasta public/ do projeto (para editar e ver na hora)
# e, como reserva, a cópia que vai dentro do .jar.
spring.web.resources.static-locations=file:./public/,classpath:/static/

# ---------- Banco de dados (MySQL local via JDBC) ----------
# A URL, o usuário e a senha ficam no arquivo banco.properties, na raiz do projeto
# (fora do git). Use o banco.example.properties como modelo.
spring.config.import=optional:file:./banco.properties

# Valores usados se o banco.properties não informar
# (o MySQL do XAMPP vem com o usuário root sem senha).
clinicavet.bd.url=jdbc:mysql://localhost:3306/clinicavet
clinicavet.bd.usuario=root
clinicavet.bd.senha=

# Fuso usado para saber qual é o dia e a hora de "agora" nas regras da agenda.
clinicavet.fuso=America/Sao_Paulo
