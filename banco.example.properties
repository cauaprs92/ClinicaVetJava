# Copie este arquivo para "banco.properties" (na mesma pasta) e coloque a senha
# do seu MySQL. O banco.properties fica fora do git.
#
# Antes de rodar pela primeira vez, crie o banco com os scripts da pasta docs/:
#   docs/codigo.mysql  (banco clinicavet e tabelas)
#   docs/insert.mysql  (horários, farmácia e consultas de exemplo)
# Se você pular esse passo, o servidor cria tudo sozinho quando inicia.

# jdbc:mysql://  -> o tipo de banco é MySQL
# localhost      -> o banco está na mesma máquina
# 3306           -> porta padrão do MySQL
# clinicavet     -> nome do banco de dados
clinicavet.bd.url=jdbc:mysql://localhost:3306/clinicavet
clinicavet.bd.usuario=root
# O banco roda no MySQL Server 8.0 (ligado pelo painel do XAMPP).
# Se o root não tem senha, deixe vazio. Se tem, coloque a senha aqui.
clinicavet.bd.senha=
